name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pipeline:
    name: Backend pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      PORT: 3001
      FRONTEND_ORIGIN: http://localhost:5173
      ADMIN_API_KEY: local-ci-admin-key-minimum-16-characters
      KAFKA_BROKER: localhost:9092
      KAFKA_TOPIC: user-events
      KAFKA_CLIENT_ID: event-pipeline-ci
      MONGODB_URI: "mongodb://admin:password@localhost:27017/events?authSource=admin&replicaSet=rs0&directConnection=true"
      MONGODB_DATABASE: events
      MONGODB_COLLECTION: raw_events
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      API_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Type-check backend
        run: pnpm --filter backend typecheck

      - name: Build backend
        run: pnpm --filter backend build

      - name: Start infrastructure
        run: |
          docker compose up -d \
            mongodb \
            kafka \
            mongodb-init \
            kafka-init \
            clickhouse

          for attempt in {1..45}; do
            mongo_ready=false
            kafka_ready=false
            clickhouse_ready=false

            if docker compose exec -T mongodb mongosh \
              --quiet \
              --username admin \
              --password password \
              --authenticationDatabase admin \
              --eval 'db.hello().isWritablePrimary ? quit(0) : quit(1)' \
              >/dev/null 2>&1
            then
              mongo_ready=true
            fi

            if docker compose exec -T kafka kafka-topics \
              --bootstrap-server localhost:9092 \
              --describe \
              --topic user-events \
              >/dev/null 2>&1
            then
              kafka_ready=true
            fi

            if docker compose exec -T clickhouse clickhouse-client \
              --user default \
              --password password \
              --query 'SELECT 1' \
              >/dev/null 2>&1
            then
              clickhouse_ready=true
            fi

            if [ "$mongo_ready" = true ] \
              && [ "$kafka_ready" = true ] \
              && [ "$clickhouse_ready" = true ]
            then
              echo "MongoDB, Kafka, and ClickHouse are ready."
              exit 0
            fi

            sleep 2
          done

          echo "Infrastructure did not become ready."
          docker compose ps --all
          docker compose logs --no-color
          exit 1

      - name: Start backend
        run: |
          nohup pnpm --filter backend start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become healthy."
          cat backend.log
          exit 1

      - name: Run unit tests
        run: pnpm test

      - name: Run pipeline integration tests
        run: pnpm test:integration

      - name: Capture failure logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-logs
          path: |
            backend.log
            docker-compose.log
          if-no-files-found: ignore

      - name: Stop backend and services
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

          docker compose down -v --remove-orphans
